calibrate_empty_room:
  fields:
    duration_seconds:
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: s

reset_baseline: {}

set_device_position:
  fields:
    device_id:
      required: true
      selector:
        text:
    x:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    y:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    z:
      default: 1.0
      selector:
        number:
          min: 0
          max: 10
          step: 0.05
          unit_of_measurement: m

define_room:
  fields:
    room_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    x_min:
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    y_min:
      default: 0
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    x_max:
      default: 5
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    y_max:
      default: 4
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: m
    polygon:
      required: false
      selector:
        object:

delete_room:
  fields:
    room_id:
      required: true
      selector:
        text:
